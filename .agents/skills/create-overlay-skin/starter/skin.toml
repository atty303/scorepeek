id = "dev.example.scorepeek.skin.starter"
name = "Starter Skin"
release = "1"
api_version = 2
description = "Neutral full-featured baseline skin ready for a visual direction."
author = "Your name"

[widget_defaults.status]
width = 440
height = 52
[widget_defaults.selection]
width = 440
height = 126
[widget_defaults.score]
width = 440
height = 194
[widget_defaults.history-list]
width = 440
height = 200
[widget_defaults.history-graph]
width = 440
height = 214
[widget_defaults.empty]
width = 512
height = 360

[[resources]]
path = "scorepeek-logo-dark-transparent.png"
media_type = "image/png"

[canvas_properties.background]
type = "enum"
default = "none"
values = ["none", "static", "animated"]

[widget_properties."*".frame-width]
type = "enum"
default = "m"
values = ["s", "m", "l"]

[widget_properties."*".fill-opacity-percent]
type = "integer"
default = 0
minimum = 0
maximum = 100
