[package]
name = "scorepeek-corpus"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
autobins = false
autoexamples = false

[features]
default = []
operations = []

[[bin]]
name = "corpus_operations"
path = "src/bin/corpus_operations.rs"
required-features = ["operations"]
test = false
bench = false

[[test]]
name = "full_replay"
path = "tests/full_replay.rs"
test = false
harness = false

[dependencies]
clap.workspace = true
scorepeek-core = { path = "../scorepeek-core" }
scorepeek-resources = { path = "../scorepeek-resources" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tempfile.workspace = true
ureq.workspace = true

[lints]
workspace = true
