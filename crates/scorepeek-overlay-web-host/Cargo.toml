[package]
name = "scorepeek-overlay-web-host"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
build = "../../scripts/overlay-build.rs"

[dependencies]
scorepeek-core = { path = "../scorepeek-core" }
scorepeek-overlay = { path = "../scorepeek-overlay" }
scorepeek-skin-sdk = { path = "../scorepeek-skin-sdk" }
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "ws"] }
chrono.workspace = true
image = { version = "0.25.10", default-features = false, features = ["png"] }
rust-embed = { version = "8.12", features = ["mime-guess", "interpolate-folder-path", "deterministic-timestamps", "debug-embed"] }
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "sync", "macros", "rt-multi-thread"] }
toml.workspace = true
wasmtime.workspace = true
zip.workspace = true

[build-dependencies]
sha2.workspace = true

[lints]
workspace = true
