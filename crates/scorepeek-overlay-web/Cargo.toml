[package]
name = "scorepeek-overlay-web"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false

[package.metadata.dist]
dist = false

[features]
default = []
web = []

[dependencies]
scorepeek-overlay-ui = { path = "../scorepeek-overlay-ui" }
dioxus.workspace = true
dioxus-web = { version = "=0.7.10", default-features = false }
serde_json.workspace = true
serde.workspace = true
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Document", "Element", "Window", "Location", "WebSocket", "MessageEvent", "Event", "CloseEvent"] }

[lints]
workspace = true
