[package]
name = "scorepeek-overlay-wayland"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
publish = false
build = "../../scripts/overlay-build.rs"
autobins = false
autoexamples = false

[[bin]]
name = "visual_native"
path = "src/bin/visual_native.rs"
required-features = ["visual-native"]
test = false
bench = false

[features]
default = []
visual-native = []

[build-dependencies]
sha2.workspace = true

[dependencies]
chrono.workspace = true
raw-wayland-handles = { package = "scorepeek-overlay-wayland-handles", path = "../scorepeek-overlay-wayland-handles" }
anyrender = "0.13.0"
anyrender_vello = "0.14.0"
blitz-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "64eb27853aa2672486b7edf825fb044be78c9db3", default-features = false, features = ["system-fonts"] }
blitz-paint = { git = "https://github.com/DioxusLabs/blitz", rev = "64eb27853aa2672486b7edf825fb044be78c9db3", default-features = false, features = ["svg"] }
blitz-traits = { git = "https://github.com/DioxusLabs/blitz", rev = "64eb27853aa2672486b7edf825fb044be78c9db3", default-features = false }
dioxus-core = "=0.7.10"
dioxus.workspace = true
dioxus-native-dom = { git = "https://github.com/DioxusLabs/blitz", rev = "64eb27853aa2672486b7edf825fb044be78c9db3", default-features = false, features = ["complex-scripts", "system-fonts"] }
fontique = { version = "0.11.1", features = ["fontconfig-dlopen"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
peniko = "0.6.0"
smithay-client-toolkit = { version = "0.21.1", default-features = false, features = ["calloop", "xkbcommon"] }
wayland-client = { version = "0.31.11", features = ["system", "dlopen"] }
wayland-protocols = { version = "0.32.13", features = ["client", "staging", "unstable"] }
scorepeek-overlay = { path = "../scorepeek-overlay" }
scorepeek-overlay-runtime = { path = "../scorepeek-overlay-runtime" }
scorepeek-core = { path = "../scorepeek-core" }
scorepeek-scores = { path = "../scorepeek-scores" }
scorepeek-skin-sdk = { path = "../scorepeek-skin-sdk" }
serde.workspace = true
serde_json.workspace = true
toml.workspace = true
wasmtime.workspace = true
zip.workspace = true

[lints]
workspace = true
