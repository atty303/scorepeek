name: Catalog and Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "23 18 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  assemble:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Assemble site and catalog
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
          PAGES_ORIGIN: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          WORKFLOW_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          site_root="$RUNNER_TEMP/pages-site"
          work_root="$RUNNER_TEMP/catalog-work"
          mkdir -p "$site_root/catalog/v1" "$work_root"
          touch "$site_root/.nojekyll"
          if [[ -d site ]]; then
            cp -a site/. "$site_root/"
          fi

          regenerate=false
          case "$EVENT_NAME" in
            schedule|workflow_dispatch) regenerate=true ;;
            push)
              if [[ "$BEFORE_SHA" =~ ^0+$ ]] || ! git cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
                regenerate=true
              elif git diff --name-only "$BEFORE_SHA" "$CURRENT_SHA" | grep -Ev '^(site/|$)' >/dev/null; then
                regenerate=true
              fi
              ;;
          esac

          current="$work_root/current.zip"
          selected="$site_root/catalog/v1/catalog.zip"
          if [[ "$regenerate" == true ]]; then
            mise run overlay:web:bundle
            candidate="$work_root/candidate.zip"
            revision=$(tr -d '[:space:]' < catalog/artifact-revision.txt)
            cargo run --locked --quiet -p scorepeek-catalog-publisher -- build --output "$candidate" --notices "$GITHUB_WORKSPACE/THIRD_PARTY_NOTICES.md" --work-directory "$work_root" --artifact-revision "$revision" --generator-commit "$CURRENT_SHA" --workflow-run-url "$WORKFLOW_RUN_URL" | tee "$work_root/build-summary.json"
            {
              echo '## Catalog candidate'
              echo '```json'
              cat "$work_root/build-summary.json"
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            if ! current_status=$(curl --silent --show-error --output "$current" --write-out '%{http_code}' "$PAGES_ORIGIN/catalog/v1/catalog.zip"); then
              echo 'Current v1 artifact could not be fetched; preserving the existing Pages deployment.' >&2
              exit 2
            fi
            case "$current_status" in
              200)
                mkdir "$work_root/selection"
                cargo run --locked --quiet -p scorepeek-catalog-publisher -- select --candidate "$candidate" --current "$current" --output "$selected" --work-directory "$work_root/selection" | tee "$work_root/selection-summary.json"
                {
                  echo '## Publication decision'
                  echo '```json'
                  cat "$work_root/selection-summary.json"
                  echo '```'
                } >> "$GITHUB_STEP_SUMMARY"
                ;;
              404)
                cp -- "$candidate" "$selected"
                echo 'No current v1 artifact exists; publishing the verified candidate.' >> "$GITHUB_STEP_SUMMARY"
                ;;
              *)
                echo "Current v1 artifact returned HTTP $current_status; preserving the existing Pages deployment." >&2
                exit 2
                ;;
            esac
          else
            current_status=$(curl --silent --show-error --output "$selected" --write-out '%{http_code}' "$PAGES_ORIGIN/catalog/v1/catalog.zip")
            [[ "$current_status" == 200 ]] || { echo "Current v1 artifact returned HTTP $current_status; preserving the existing Pages deployment." >&2; exit 2; }
            echo 'Landing-page-only change: preserved the current v1 artifact bytes without source access.' >> "$GITHUB_STEP_SUMMARY"
          fi

          while IFS= read -r frozen; do
            [[ -z "$frozen" || "$frozen" == \#* ]] && continue
            [[ "$frozen" =~ ^catalog/v[0-9]+/catalog\.zip$ ]] || { echo "invalid frozen schema path: $frozen" >&2; exit 2; }
            [[ "$frozen" != catalog/v1/catalog.zip ]] || { echo 'current schema must not be frozen' >&2; exit 2; }
            mkdir -p "$site_root/$(dirname -- "$frozen")"
            frozen_status=$(curl --silent --show-error --output "$site_root/$frozen" --write-out '%{http_code}' "$PAGES_ORIGIN/$frozen")
            [[ "$frozen_status" == 200 ]] || { echo "Frozen artifact $frozen returned HTTP $frozen_status; preserving the existing Pages deployment." >&2; exit 2; }
          done < catalog/frozen-schemas.txt
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    needs: assemble
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  scheduled-failure-monitor:
    if: always() && github.event_name == 'schedule'
    needs: [assemble, deploy]
    permissions:
      actions: read
      issues: write
    runs-on: ubuntu-24.04
    env:
      GH_TOKEN: ${{ github.token }}
      MARKER: "<!-- scorepeek-catalog-scheduled-failure -->"
    steps:
      - name: Update consecutive-failure issue
        env:
          CURRENT_FAILED: ${{ needs.assemble.result != 'success' || needs.deploy.result != 'success' }}
        run: |
          set -euo pipefail
          issue=$(gh api "repos/$GITHUB_REPOSITORY/issues?state=open&per_page=100" --jq "[.[] | select(.pull_request == null) | select(.body != null and (.body | contains(\"$MARKER\"))) | .number] | first // empty")
          if [[ "$CURRENT_FAILED" == false ]]; then
            if [[ -n "$issue" ]]; then
              gh issue close "$issue" --repo "$GITHUB_REPOSITORY" --comment 'The scheduled catalog workflow succeeded; the consecutive-failure state is reset.'
            fi
            exit 0
          fi
          mapfile -t conclusions < <(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/catalog-pages.yml/runs?event=schedule&per_page=4" --jq ".workflow_runs | map(select(.id != $GITHUB_RUN_ID)) | .[:2] | .[].conclusion")
          if [[ ${#conclusions[@]} -lt 2 || "${conclusions[0]}" != failure || "${conclusions[1]}" != failure ]]; then
            exit 0
          fi
          if [[ -z "$issue" ]]; then
            body="$MARKER

          The scheduled catalog publication workflow has failed three consecutive times.

          Latest run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            gh issue create --repo "$GITHUB_REPOSITORY" --title 'Scheduled catalog publication is failing' --body "$body"
          fi
