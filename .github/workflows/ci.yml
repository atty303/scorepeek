name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang1-18 libclang-common-18-dev libpipewire-0.3-0 libxkbcommon0 mesa-vulkan-drivers
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true
      - name: Install browser runtime
        run: mise exec -- deno run --no-config -A npm:@playwright/cli@0.1.21 install-browser chromium --only-shell --with-deps
      - run: mise run test -- --no-fail-fast
