name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: jdx/mise-action@7e36c90d9ab29c4151a2384db3006f3ec8a8cc654 # v4.2.4
        with:
          cache: true
      - run: mise run test
