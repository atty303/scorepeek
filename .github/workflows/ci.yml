name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: test / ${{ matrix.shard }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: checks
            task: test:checks
            browser: false
            vulkan: false
          - shard: capture
            task: test:capture
            browser: false
            vulkan: false
          - shard: runtime
            task: test:runtime
            browser: false
            vulkan: false
          - shard: overlay-native
            task: test:overlay:native
            browser: false
            vulkan: true
          - shard: overlay-browser
            task: test:overlay:browser
            browser: true
            vulkan: false
          - shard: overlay-embedded-unit
            task: test:overlay:embedded-unit
            browser: false
            vulkan: true
          - shard: overlay-embedded-integration
            task: test:overlay:embedded-integration
            browser: false
            vulkan: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang1-18 libclang-common-18-dev libpipewire-0.3-0 libxkbcommon0
      - name: Install software Vulkan
        if: matrix.vulkan
        run: sudo apt-get install --yes --no-install-recommends mesa-vulkan-drivers
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          cache: true
      - if: matrix.browser
        name: Install browser runtime
        run: mise exec -- playwright install --with-deps --only-shell chromium
      - run: mise run ${{ matrix.task }}
