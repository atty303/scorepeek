name: Release

on:
  schedule:
    - cron: "17 4 * * *"
      timezone: "Asia/Tokyo"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Install native build prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends libclang1-18 libclang-common-18-dev libpipewire-0.3-0 libxkbcommon0

      - name: Setup mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: true

      - name: Release
        uses: atty303/repository-template/.github/actions/release@00351cee0fe0ce1f9a9facd30a39830905db5ca5
        with:
          versioning: calver
          github-token: ${{ github.token }}
