id = "dev.atty303.scorepeek.skin.dj-blackbox"
name = "DJ Blackbox"
release = "2"
api_version = 1
description = "Dark industrial panels with acid-green indicators."
author = "scorepeek"

[canvas_properties.background]
type = "enum"
default = "none"
values = ["none", "static", "animated"]

[widget_properties."*".frame-width]
type = "enum"
default = "m"
values = ["s", "m", "l"]

[widget_properties."*".fill-opacity-percent]
type = "integer"
default = 0
minimum = 0
maximum = 100
