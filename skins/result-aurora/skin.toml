id = "dev.atty303.scorepeek.skin.result-aurora"
name = "Result Aurora"
release = "4"
api_version = 2
description = "Violet aurora glass with warm result accents."
author = "scorepeek"

[widget_defaults.status]
width = 544
height = 44
[widget_defaults.selection]
width = 544
height = 124
[widget_defaults.score]
width = 544
height = 200
[widget_defaults.history-list]
width = 544
height = 156
[widget_defaults.history-graph]
width = 544
height = 208
[widget_defaults.empty]
