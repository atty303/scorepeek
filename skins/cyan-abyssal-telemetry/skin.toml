id = "dev.atty303.scorepeek.skin.cyan-abyssal-telemetry"
name = "Cyan Abyssal Telemetry"
release = "2026-09-25"
api_version = 2
description = "Deep-sea telemetry in black titanium, etched acrylic and sonar cyan"
author = "atty303"
license = "MIT AND OFL-1.1"

[widget_defaults.status]
width = 440
height = 52

[widget_defaults.selection]
width = 440
height = 126

[widget_defaults.score]
width = 440
height = 194

[widget_defaults.history-list]
width = 600
height = 200

[widget_defaults.history-graph]
width = 600
height = 200

[widget_defaults.empty]
width = 300
height = 80

[canvas_properties.background]
type = "enum"
default = "animated"
values = ["off", "static", "animated"]

[widget_properties.empty.interior-opacity]
type = "number"
default = 0.0
minimum = 0.0
maximum = 1.0

