[workspace]
members = ["crates/scorepeek", "crates/scorepeek-corpus", "crates/scorepeek-scores", "crates/scorepeek-overlay-ui", "crates/scorepeek-overlay", "crates/scorepeek-overlay-handles", "crates/scorepeek-overlay-web"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[workspace.metadata.dist]
cargo-dist-version = "0.32.0"
checksum = "sha256"
ci = []
hosting = []
installers = []
packages = ["scorepeek"]
source-tarball = false
targets = ["x86_64-unknown-linux-gnu"]
features = ["embedded-web"]

[profile.dist]
inherits = "release"
lto = "thin"

[workspace.dependencies]
chrono = "0.4.45"
dioxus = { version = "=0.7.10", default-features = false, features = ["macro", "html", "signals", "hooks"] }
encoding_rs = "0.8.35"
futures-util = "0.3.34"
imageproc = { version = "0.27.0", default-features = false }
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["std", "download-binaries", "tls-rustls", "api-27"] }
pipewire = "0.10.0"
qoi = "0.4.1"
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
signal-hook = { version = "0.4.4", default-features = false }
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "fs", "io-util", "time"] }
toml = "1.1.4"
unicode-normalization = "0.1.25"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
url = "2.5.8"
uuid = { version = "1.24.1", features = ["serde", "v5"] }
x11rb = { version = "0.13.2", default-features = false, features = ["image"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"

[profile.dev.package.sha2]
opt-level = 3
