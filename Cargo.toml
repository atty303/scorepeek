[workspace]
members = ["crates/scorepeek", "crates/scorepeek-corpus"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.97.1"

[workspace.dependencies]
encoding_rs = "0.8.35"
futures-util = "0.3.34"
object_store = { version = "0.14.1", default-features = false, features = ["aws"] }
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
sha2 = "0.11.0"
tempfile = "3.27.0"
tokio = { version = "1.53.1", features = ["rt", "fs", "io-util", "time"] }
unicode-normalization = "0.1.25"
ureq = { version = "3.4.0", default-features = false, features = ["rustls"] }
url = "2.5.8"
uuid = { version = "1.24.1", features = ["serde", "v5"] }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "deny"
pedantic = "deny"
