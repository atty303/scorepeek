min_version = "2026.8.3"

[tools]
actionlint = "1.7.12"
hk = "1.54.1"
rust = "1.97.1"
taplo = "0.10.0"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tasks.check]
description = "Check the repository or selected files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk check "$@"
fi
exec hk check --all
'''

[tasks.fix]
description = "Fix the repository or selected files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk fix "$@"
fi
exec hk fix --all
'''

[tasks.test]
description = "Run all reproducible checks"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run check README.md
mise run check
cargo clippy --locked --workspace --all-targets -- -D warnings
exec cargo test --locked --workspace
'''

[tasks.doctor]
description = "Print the local target inventory as versioned JSON"
run = "cargo run --locked --quiet -- doctor"

[tasks."catalog:sync"]
description = "Synchronize and conditionally activate the live catalog"
run = "cargo run --locked --quiet -- catalog sync"
