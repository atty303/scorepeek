min_version = "2026.8.3"

[tools]
"cargo:dioxus-cli" = "0.7.10"
actionlint = "1.7.12"
cargo-dist = "0.32.0"
hk = "1.54.1"
"npm:playwright" = "1.63.0"
python = "3.12.13"
rclone = "1.74.2"
rust = { version = "1.97.1", components = ["clippy", "rustfmt"] }
taplo = "0.10.0"
uv = "0.11.7"
zig = "0.16.0"

[tools."http:pkgconf"]
version = "3.0.1.post0"
format = "zip"
bin_path = "pkgconf/.bin"

[tools."http:pkgconf".platforms.linux-x64]
url = "https://files.pythonhosted.org/packages/2c/82/36356bd30ef13ea767c53a4be7c508621e77c2d52e60b48929710de07230/pkgconf-3.0.1.post0-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl"
checksum = "sha256:ff5a7fe9b4248396023938ef14b344e9fb47d24882ebab1ffa926b62f0a10ebd"

[tools."http:libpipewire-sdk"]
version = "1.6.8-1"
format = "tar.zst"
bin_path = "."

[tools."http:libpipewire-sdk".platforms.linux-x64]
url = "https://archive.archlinux.org/packages/l/libpipewire/libpipewire-1%3A1.6.8-1-x86_64.pkg.tar.zst"
checksum = "sha256:4bf22c0509618e2093b5d7662a2fce23bae5afb2a23ff45e26ebd548b5c7cedc"

[tools."http:libxkbcommon-sdk"]
version = "1.7.0-2"
format = "tar.zst"
bin_path = "."

[tools."http:libxkbcommon-sdk".platforms.linux-x64]
url = "https://archive.archlinux.org/packages/l/libxkbcommon/libxkbcommon-1.7.0-2-x86_64.pkg.tar.zst"
checksum = "sha256:751b7435ae85996dab24e9dabf502fb856f5d55befa177fe51f23afd038323e8"

[tool_alias]
ffmpeg = "github:shaka-project/static-ffmpeg-binaries"
ffprobe = "github:shaka-project/static-ffmpeg-binaries"

[tools.ffmpeg]
version = "n8.1.2-1"
matching_regex = "^ffmpeg-(linux|osx|win)-(x64|arm64)(\\.exe)?$"
bin = "ffmpeg"

[tools.ffprobe]
version = "n8.1.2-1"
matching_regex = "^ffprobe-(linux|osx|win)-(x64|arm64)(\\.exe)?$"
bin = "ffprobe"

[env]
SCOREPEEK_WEB_ASSET_DIR = "{{ config_root }}/target/dx/scorepeek-overlay-web/release/web/public"
HK_MISE = 1
PKG_CONFIG = "{{ config_root }}/scripts/pkg-config-scorepeek.bash"
LIBCLANG_PATH = "{{ exec(command='scripts/resolve-clang-build-input.bash library') }}"
BINDGEN_EXTRA_CLANG_ARGS = "-resource-dir={{ exec(command='scripts/resolve-clang-build-input.bash resource-dir') }}"

[hooks]
postinstall = "hk install --mise"

[tasks.check]
description = "Check the repository or selected files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk check "$@"
fi
hk check --all
exec mise run dist:plan
'''

[tasks.build]
description = "Build the runnable debug CLI with the embedded OBS UI"
depends = ["overlay:web:bundle"]
run = "mise run capture:vulkan:build && cargo build --locked -p scorepeek --features embedded-web"

[tasks."dist:plan"]
description = "Inspect the local cargo-dist release plan"
run = "dist plan"

[tasks."dist:build"]
description = "Build the local Linux x86-64 release archive and checksum"
depends = ["overlay:web:bundle"]
run = "dist build"

[tasks."overlay:web:check"]
description = "Type-check the shared browser UI without bundling assets"
run = "cargo check --locked -p scorepeek-overlay-web --target wasm32-unknown-unknown"

[tasks."overlay:web:bundle"]
description = "Build the real browser assets used by the distributed executable"
run = "dx bundle --package scorepeek-overlay-web --web --release --locked --debug-symbols false"
sources = [
  "Cargo.toml",
  "Cargo.lock",
  "scripts/overlay-build.rs",
  "crates/scorepeek-overlay/Cargo.toml",
  "crates/scorepeek-overlay/src/**",
  "crates/scorepeek-overlay-handles/Cargo.toml",
  "crates/scorepeek-overlay-handles/src/**",
  "crates/scorepeek-overlay-ui/Cargo.toml",
  "crates/scorepeek-overlay-ui/src/**",
  "crates/scorepeek-overlay-ui/assets/**",
  "crates/scorepeek-overlay-ui/styles/**",
  "crates/scorepeek-overlay-ui/motion.js",
  "crates/scorepeek-overlay-web/Cargo.toml",
  "crates/scorepeek-overlay-web/src/**",
]
outputs = ["target/dx/scorepeek-overlay-web/release/web/public/index.html"]

[tasks."overlay:web:test"]
description = "Test the production browser route, embedded assets, and child lifecycle"
depends = ["overlay:web:browser:test"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo test --locked -p scorepeek-overlay-web
cargo test --locked -p scorepeek-overlay --features embedded-web --lib
cargo test --locked -p scorepeek --features embedded-web --test overlay
'''

[tasks."overlay:web:browser:install"]
description = "Install the headless Chromium revision pinned by the repository Playwright tool"
run = "playwright install --only-shell chromium"

[tasks."overlay:web:browser:server:build"]
description = "Build the OBS-equivalent browser test server with the current embedded bundle"
depends = ["overlay:web:bundle"]
run = "cargo build --locked -p scorepeek-overlay --features embedded-web --example visual_obs"

[tasks."overlay:web:browser:test"]
description = "Test the production browser editor and canvas replicas in pinned Chromium"
depends = [
  "overlay:web:browser:server:build",
  "overlay:skins:build",
  "overlay:web:browser:install",
]
run = "scripts/test-overlay-browser.bash"

[tasks."overlay:wayland:build:check"]
description = "Build and test the standalone Wayland shell without host development metadata"
run = "cargo test --locked -p scorepeek-overlay-handles --lib"

[tasks."overlay:skin:render"]
description = "Render a skin preview JSON to a create-only PAM using native DOM/Vello (no Wayland or DB)"
run = 'cargo run --locked -p scorepeek-overlay --example render_skin -- "$@"'

[tasks."overlay:skins:build"]
description = "Build repository skin ZIP packages without installing them"
run = "bash scripts/build-skins.sh"

[tasks."overlay:visual:native"]
description = "Run a scripted native Dioxus/Blitz/Vello visual-debug scenario without Wayland"
run = 'scripts/with-isolated-skins.sh cargo run --locked -p scorepeek-overlay --example visual_native -- "$@"'

[tasks."overlay:visual:wayland"]
description = "Open the production Wayland editor with an isolated empty config for a bounded live check"
run = 'SCOREPEEK_PRESERVE_XDG_RUNTIME_DIR=1 scripts/with-isolated-skins.sh cargo run --locked -p scorepeek-overlay --example visual_wayland -- "$@"'

[tasks."overlay:visual:wayland:nested"]
description = "Run the production multi-output editor in a bounded headless nested Scroll scenario"
depends = ["overlay:visual:wayland:nested:build"]
run = "scripts/test-overlay-wayland-nested.bash"

[tasks."overlay:visual:wayland:nested:build"]
description = "Build the production Wayland visual runner used by the nested Scroll scenario"
depends = ["overlay:skins:build"]
run = "cargo build --release --locked -p scorepeek-overlay --example visual_wayland -p scorepeek-overlay-handles --example virtual_pointer"

[tasks."overlay:visual:obs"]
description = "Serve the production OBS overlay from an isolated config for Codex Browser inspection"
depends = ["overlay:web:bundle"]
run = 'scripts/with-isolated-skins.sh cargo run --locked -p scorepeek-overlay --features embedded-web --example visual_obs -- "$@"'

[tasks."overlay:test:live"]
description = "Explicit live overlay run; supply a dedicated --scores-db instance and profile"
depends = ["overlay:web:bundle"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
case " $* " in
  *" --scores-db "*) ;;
  *) echo 'Supply --scores-db with a dedicated verification instance.' >&2; exit 2 ;;
esac
exec cargo run --locked -p scorepeek --features embedded-web -- run --overlay wayland --overlay obs "$@"
'''

[tasks."dist:test"]
description = "Build and smoke-test the local Linux x86-64 release archive"
depends = ["overlay:web:bundle"]
run = "scripts/test-dist-artifact.bash"

[tasks.fix]
description = "Fix the repository or selected files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk fix "$@"
fi
exec hk fix --all
'''

[tasks.test]
description = "Run all reproducible checks"
depends = ["overlay:skins:build"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run native:verify
mise run capture:vulkan:test
mise run overlay:wayland:build:check
mise run overlay:web:check
mise run check README.md
mise run check
mise run ocr:test
mise run catalog:schedule:systemd:verify
cargo clippy --locked --workspace --all-targets -- -D warnings
cargo test --locked --workspace
exec mise run overlay:web:test
'''

[tasks.doctor]
description = "Print the local target inventory as versioned JSON"
run = "cargo run --locked --quiet -p scorepeek -- doctor"

[tasks."capture:vulkan:build"]
description = "Build the Scorepeek Vulkan capture layer with pinned Zig"
run = "zig build --build-file native/vulkan-capture/build.zig --cache-dir target/vulkan-capture-cache --global-cache-dir target/vulkan-capture-global-cache --release=fast --prefix target/vulkan-capture"

[tasks."capture:vulkan:test"]
description = "Verify the layer manifest, ELF boundary, and Rust protocol/import contracts"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run capture:vulkan:build
test -f target/vulkan-capture/lib/libscorepeek_vulkan_capture.so
test -f target/vulkan-capture/share/vulkan/explicit_layer.d/VkLayer_SCOREPEEK_capture.json
readelf -d target/vulkan-capture/lib/libscorepeek_vulkan_capture.so | grep -q 'libc.so'
! readelf -d target/vulkan-capture/lib/libscorepeek_vulkan_capture.so | grep -Eq 'libstdc\+\+|libc\+\+'
cargo test --locked -p scorepeek-vulkan-capture
cargo test --locked -p scorepeek capture::vulkan
'''

[tasks."native:verify"]
description = "Verify the pinned PipeWire SDK and host native build prerequisites"
