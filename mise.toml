[tasks."capture:vulkan:build"]
description = "Build the Scorepeek Vulkan capture layer with pinned Zig"
run = "zig build --build-file native/vulkan-capture/build.zig --cache-dir target/vulkan-capture-cache --global-cache-dir target/vulkan-capture-global-cache --release=fast -Dtarget=x86_64-linux-gnu -Dcpu=baseline --prefix target/vulkan-capture"

[tasks."capture:vulkan:test"]
description = "Verify the layer manifest, ELF boundary, and Rust protocol/import contracts"
depends = ["overlay:web:bundle"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run capture:vulkan:build
test -f target/vulkan-capture/share/scorepeek/vulkan-layer/libscorepeek_vulkan_capture.so
test -f target/vulkan-capture/share/vulkan/explicit_layer.d/VkLayer_SCOREPEEK_capture.json
cmp native/vulkan-capture/layer/VkLayer_SCOREPEEK_capture.json target/vulkan-capture/share/vulkan/explicit_layer.d/VkLayer_SCOREPEEK_capture.json
readelf -d target/vulkan-capture/share/scorepeek/vulkan-layer/libscorepeek_vulkan_capture.so | grep -q 'libc.so'
! readelf -d target/vulkan-capture/share/scorepeek/vulkan-layer/libscorepeek_vulkan_capture.so | grep -Eq 'libstdc\+\+|libc\+\+'
! readelf -S target/vulkan-capture/share/scorepeek/vulkan-layer/libscorepeek_vulkan_capture.so | grep -q '\.symtab'
readelf -h target/vulkan-capture/share/scorepeek/vulkan-layer/libscorepeek_vulkan_capture.so | grep -Eq 'Machine:.*X86-64'
! objdump -d target/vulkan-capture/share/scorepeek/vulkan-layer/libscorepeek_vulkan_capture.so | grep -Eq '%[yz]mm|[[:space:]]v[a-z][a-z0-9]+'
cargo test --locked -p scorepeek-vulkan-capture
cargo test --locked -p scorepeek-runtime capture::vulkan
cargo test --locked -p scorepeek-runtime vulkan_layer
'''

