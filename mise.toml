#!/usr/bin/env bash
set -euo pipefail
SCOREPEEK_PREBUILT_SKINS=1 mise run test:checks ::: test:capture ::: test:runtime ::: test:overlay:native ::: test:overlay:browser ::: test:overlay:embedded-unit ::: test:overlay:embedded-integration
