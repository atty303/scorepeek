CARGO_BUILD_JOBS="$runtime_build_jobs" cargo test --locked --workspace --exclude scorepeek-overlay-wayland --exclude scorepeek-overlay-web-host --exclude scorepeek-overlay-web-client
exec env CARGO_BUILD_JOBS="$runtime_build_jobs" cargo test --locked -p scorepeek-corpus --features runtime-replay
