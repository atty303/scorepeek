[tasks."overlay:visual:wayland:nested:build"]
description = "Build the production Wayland visual runner used by the nested Scroll scenario"
depends = ["overlay:skins:build", "overlay:web:bundle"]
run = "cargo build --release --locked -p scorepeek-runtime --example visual_wayland -p scorepeek-overlay-wayland-handles --example virtual_pointer"

[tasks."overlay:visual:obs"]
description = "Serve the production OBS overlay from an isolated config for Codex Browser inspection"
depends = ["overlay:web:bundle"]
run = 'scripts/with-isolated-skins.sh cargo run --locked -p scorepeek-runtime --example visual_obs -- "$@"'

[tasks."overlay:test:live"]
description = "Explicit live overlay run; supply capture selection and a dedicated scores database"
depends = ["overlay:web:bundle"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
case " $* " in
  *" --scores-db "*) ;;
  *) echo 'Supply --scores-db with a dedicated verification instance.' >&2; exit 2 ;;
esac
case " $* " in
  *" --capture "*) ;;
  *) echo 'Supply --capture pipewire or --capture vulkan-layer and its required selector.' >&2; exit 2 ;;
esac
exec cargo run --locked -p scorepeek-cli -- run --overlay-wayland --overlay-obs "$@"
'''

