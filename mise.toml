min_version = "2026.8.3"
monorepo_root = true

[monorepo]
config_roots = ["tools/ocr"]

[settings]
cargo.binstall_native = true

[tools]
"cargo:dioxus-cli" = "0.7.10"
actionlint = "1.7.12"
cargo-dist = "0.32.0"
hk = "1.54.1"
"npm:playwright" = "1.63.0"
rclone = "1.74.2"
rust = { version = "1.97.1", components = [
  "clippy",
  "rustfmt",
], targets = [
  "wasm32-unknown-unknown",
] }
taplo = "0.10.0"
zig = "0.16.0"

[tools."http:pkgconf"]
version = "3.0.1.post0"
format = "zip"
bin_path = "pkgconf/.bin"

[tools."http:pkgconf".platforms.linux-x64]
url = "https://files.pythonhosted.org/packages/2c/82/36356bd30ef13ea767c53a4be7c508621e77c2d52e60b48929710de07230/pkgconf-3.0.1.post0-py3-none-manylinux2014_x86_64.manylinux_2_17_x86_64.manylinux_2_28_x86_64.whl"
checksum = "sha256:ff5a7fe9b4248396023938ef14b344e9fb47d24882ebab1ffa926b62f0a10ebd"

[tools."http:libpipewire-sdk"]
version = "1.6.8-1"
format = "tar.zst"
bin_path = "."

[tools."http:libpipewire-sdk".platforms.linux-x64]
url = "https://archive.archlinux.org/packages/l/libpipewire/libpipewire-1%3A1.6.8-1-x86_64.pkg.tar.zst"
checksum = "sha256:4bf22c0509618e2093b5d7662a2fce23bae5afb2a23ff45e26ebd548b5c7cedc"

[tools."http:libxkbcommon-sdk"]
version = "1.7.0-2"
format = "tar.zst"
bin_path = "."

[tools."http:libxkbcommon-sdk".platforms.linux-x64]
url = "https://archive.archlinux.org/packages/l/libxkbcommon/libxkbcommon-1.7.0-2-x86_64.pkg.tar.zst"
checksum = "sha256:751b7435ae85996dab24e9dabf502fb856f5d55befa177fe51f23afd038323e8"

[tool_alias]
ffmpeg = "github:shaka-project/static-ffmpeg-binaries"
ffprobe = "github:shaka-project/static-ffmpeg-binaries"

[tools.ffmpeg]
version = "n8.1.2-1"
matching_regex = "^ffmpeg-(linux|osx|win)-(x64|arm64)(\\.exe)?$"
bin = "ffmpeg"

[tools.ffprobe]
version = "n8.1.2-1"
matching_regex = "^ffprobe-(linux|osx|win)-(x64|arm64)(\\.exe)?$"
bin = "ffprobe"

[env]
SCOREPEEK_WEB_ASSET_DIR = "{{ config_root }}/target/dx/scorepeek-overlay-web-client/release/web/public"
HK_MISE = 1
PKG_CONFIG = "{{ config_root }}/scripts/pkg-config-scorepeek.bash"
LIBCLANG_PATH = "{{ exec(command='scripts/resolve-clang-build-input.bash library') }}"
BINDGEN_EXTRA_CLANG_ARGS = "-resource-dir={{ exec(command='scripts/resolve-clang-build-input.bash resource-dir') }}"

[hooks]
postinstall = "hk install --mise"

[tasks.check]
description = "Check the repository or selected files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk check "$@"
fi
hk check --all
exec mise run dist:plan
'''

[tasks.build]
description = "Build the runnable debug CLI with the embedded OBS UI"
depends = ["overlay:web:bundle"]
run = "cargo build --locked -p scorepeek-cli"

[tasks."dist:plan"]
description = "Inspect the local cargo-dist release plan"
run = "dist plan"

[tasks."dist:build"]
description = "Build the local Linux x86-64 release archive"
depends = ["overlay:web:bundle"]
run = "dist build"

[tasks."release:build"]
description = "Build and verify GitHub Release artifacts for a supplied version"
depends = ["overlay:skins:build", "overlay:web:bundle"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# != 2 )); then
  echo 'usage: mise run release:build -- VERSION OUTPUT_DIRECTORY' >&2
  exit 2
fi
readonly version="$1"
readonly output_directory="$2"
readonly target="x86_64-unknown-linux-gnu"
readonly archive="target/distrib/scorepeek-${target}.tar.xz"

scripts/test-dist-artifact.bash "$version"
cp -- "$archive" "$output_directory/"
'''

[tasks."site:check"]
description = "Check the bilingual landing page structure and local assets"
run = "scripts/check-site.bash"

[tasks."site:browser:test"]
description = "Test the bilingual landing page in pinned Chromium"
depends = ["overlay:web:browser:install"]
run = "scripts/test-site-browser.bash"

[tasks."overlay:web:check"]
description = "Type-check the shared browser UI without bundling assets"
run = "cargo check --locked -p scorepeek-overlay-web-client --target wasm32-unknown-unknown"

[tasks."overlay:web:bundle"]
description = "Build the real browser assets used by the distributed executable"
run = '''
#!/usr/bin/env bash
set -euo pipefail
readonly complete="target/dx/scorepeek-overlay-web-client/release/web/.scorepeek-bundle-complete"
rm -f -- "$complete"
rm -rf -- target/dx/scorepeek-overlay-web-client/release/web/public
dx bundle --package scorepeek-overlay-web-client --web --release --locked --debug-symbols false
touch "$complete"
'''
sources = [
  "crates/scorepeek-overlay-wayland-handles/src/**",
  "crates/scorepeek-overlay-wayland/src/**",
  "crates/scorepeek-overlay-web-client/src/**",
  "crates/scorepeek-overlay-web-host/src/**",
  "crates/scorepeek-overlay/src/**",
  "crates/scorepeek-overlay/styles/**",
  "Cargo.lock",
  "Cargo.toml",
  "crates/scorepeek-overlay-wayland-handles/Cargo.toml",
  "crates/scorepeek-overlay-wayland/Cargo.toml",
  "crates/scorepeek-overlay-web-client/Cargo.toml",
  "crates/scorepeek-overlay-web-host/Cargo.toml",
  "crates/scorepeek-overlay/Cargo.toml",
  "scripts/overlay-build.rs",
]
outputs = [
  "target/dx/scorepeek-overlay-web-client/release/web/.scorepeek-bundle-complete",
  "target/dx/scorepeek-overlay-web-client/release/web/public/index.html",
]

[tasks."overlay:web:test"]
description = "Test the production browser route, embedded assets, and child lifecycle"
depends = ["overlay:web:browser:test"]
run = "mise run overlay:web:embedded:test"

[tasks."overlay:web:embedded:test"]
description = "Test the embedded browser assets and child lifecycle"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run overlay:web:embedded:unit:test
exec mise run overlay:web:embedded:integration:test
'''

[tasks."overlay:web:embedded:unit:test"]
description = "Test embedded browser UI and overlay library assets"
depends = ["overlay:web:bundle"]
run = '''
#!/usr/bin/env bash
set -euo pipefail
cargo test --locked -p scorepeek-overlay-web-client
cargo test --locked -p scorepeek-overlay --lib
cargo test --locked -p scorepeek-overlay-wayland --lib
exec cargo test --locked -p scorepeek-overlay-web-host --lib
'''

[tasks."overlay:web:embedded:integration:test"]
description = "Test embedded browser assets in the scorepeek process"
depends = ["overlay:web:bundle"]
run = "cargo test --locked -p scorepeek-cli --test overlay"

[tasks."overlay:web:browser:install"]
description = "Install the headless Chromium revision pinned by the repository Playwright tool"
run = "playwright install --only-shell chromium"

[tasks."overlay:web:browser:server:build"]
description = "Build the OBS-equivalent browser test server with the current embedded bundle"
depends = ["overlay:web:bundle"]
run = "cargo build --locked -p scorepeek-runtime --example visual_obs"

[tasks."overlay:web:browser:test"]
description = "Test the production browser editor and canvas replicas in pinned Chromium"
depends = [
  "overlay:web:browser:server:build",
  "overlay:skins:build",
  "overlay:web:browser:install",
]
run = "scripts/test-overlay-browser.bash"

[tasks."overlay:wayland:build:check"]
description = "Build and test the standalone Wayland shell without host development metadata"
run = "cargo test --locked -p scorepeek-overlay-wayland-handles --lib"

[tasks."overlay:skins:build"]
description = "Build repository skin ZIP packages without installing them"
