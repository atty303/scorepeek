min_version = "2026.8.3"

[tools]
actionlint = "1.7.12"
hk = "1.54.1"
taplo = "0.10.0"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tasks.check]
description = "Check the repository or selected files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk check "$@"
fi
exec hk check --all
'''

[tasks.fix]
description = "Fix the repository or selected files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk fix "$@"
fi
exec hk fix --all
'''

[tasks.test]
description = "Run all reproducible checks"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run check README.md
exec mise run check
'''
