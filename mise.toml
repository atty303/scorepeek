run = 'scripts/with-isolated-skins.sh cargo run --locked -p scorepeek-overlay-wayland --example visual_native -- "$@"'

[tasks."overlay:visual:wayland"]
description = "Open the production Wayland editor with an isolated empty config for a bounded live check"
