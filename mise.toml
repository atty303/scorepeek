min_version = "2026.8.3"

[tools]
actionlint = "1.7.12"
hk = "1.54.1"
rclone = "1.74.2"
rust = { version = "1.97.1", components = ["clippy", "rustfmt"] }
taplo = "0.10.0"

[tool_alias]
ffmpeg = "github:shaka-project/static-ffmpeg-binaries"
ffprobe = "github:shaka-project/static-ffmpeg-binaries"

[tools.ffmpeg]
version = "n8.1.2-1"
matching_regex = "^ffmpeg-(linux|osx|win)-(x64|arm64)(\\.exe)?$"
bin = "ffmpeg"

[tools.ffprobe]
version = "n8.1.2-1"
matching_regex = "^ffprobe-(linux|osx|win)-(x64|arm64)(\\.exe)?$"
bin = "ffprobe"

[env]
HK_MISE = 1

[hooks]
postinstall = "hk install --mise"

[tasks.check]
description = "Check the repository or selected files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk check "$@"
fi
exec hk check --all
'''

[tasks.fix]
description = "Fix the repository or selected files"
run = '''
#!/usr/bin/env bash
set -euo pipefail
if (( $# > 0 )); then
  exec hk fix "$@"
fi
exec hk fix --all
'''

[tasks.test]
description = "Run all reproducible checks"
run = '''
#!/usr/bin/env bash
set -euo pipefail
mise run check README.md
mise run check
mise run catalog:schedule:systemd:verify
cargo clippy --locked --workspace --all-targets -- -D warnings
cargo test --locked --workspace
exec mise run corpus:dataset:test:e2e
'''

[tasks.doctor]
description = "Print the local target inventory as versioned JSON"
run = "cargo run --locked --quiet -p scorepeek -- doctor"

[tasks."catalog:sync"]
description = "Synchronize and conditionally activate the live catalog"
run = "cargo run --locked --quiet -p scorepeek -- catalog sync"

[tasks."corpus:ingest"]
description = "Ingest immutable media into an explicit private corpus store"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec cargo run --locked --quiet -p scorepeek-corpus -- ingest "$@"
'''

[tasks."corpus:recording:import"]
description = "Import one complete recording as a reusable private dataset root"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec cargo run --locked --quiet -p scorepeek-corpus -- recording import "$@"
'''

[tasks."corpus:dataset:seal"]
description = "Seal all imported recordings as an immutable dataset generation"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec cargo run --locked --quiet -p scorepeek-corpus -- dataset seal "$@"
'''

[tasks."corpus:dataset:push"]
description = "Upload and verify one recording dataset generation"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec cargo run --locked --quiet -p scorepeek-corpus -- dataset push "$@"
'''

[tasks."corpus:dataset:pull"]
description = "Download and verify one recording dataset generation"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec cargo run --locked --quiet -p scorepeek-corpus -- dataset pull "$@"
'''

[tasks."corpus:dataset:verify"]
description = "Verify every local byte in one recording dataset generation"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec cargo run --locked --quiet -p scorepeek-corpus -- dataset verify "$@"
'''

[tasks."corpus:dataset:remote-verify"]
description = "Download-hash every remote byte in one recording dataset generation"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec cargo run --locked --quiet -p scorepeek-corpus -- dataset remote-verify "$@"
'''

[tasks."corpus:dataset:test:e2e"]
description = "Exercise recording dataset CLI round-trip against a local S3 mock"
run = "scripts/test-corpus-dataset-e2e.bash"

[tasks."corpus:generation:seal"]
description = "Seal the current private source bindings as an immutable corpus generation"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec cargo run --locked --quiet -p scorepeek-corpus -- generation seal "$@"
'''

[tasks."corpus:label:author"]
description = "Validate and publish one canonical private complete-label document"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec cargo run --locked --quiet -p scorepeek-corpus -- label author "$@"
'''

[tasks."corpus:index:generate"]
description = "Generate a canonical replay index from strict private frame metadata"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec cargo run --locked --quiet -p scorepeek-corpus -- index generate "$@"
'''

[tasks."corpus:media:probe"]
description = "Probe one immutable private media source into bounded PTS/decode-order evidence"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec cargo run --locked --quiet -p scorepeek-corpus -- media probe "$@"
'''

[tasks."corpus:media:extract"]
description = "Extract an explicit bounded private RGB8 frame selection"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec cargo run --locked --quiet -p scorepeek-corpus -- media extract "$@"
'''

[tasks."corpus:synthetic:render"]
description = "Render a deterministic catalog-independent synthetic title set"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec cargo run --locked --quiet -p scorepeek-corpus -- synthetic render "$@"
'''

[tasks."corpus:replay:validate"]
description = "Validate private corpus replay metadata"
run = '''
#!/usr/bin/env bash
set -euo pipefail
exec cargo run --locked --quiet -p scorepeek-corpus -- replay validate "$@"
'''

[tasks."catalog:schedule:systemd:verify"]
description = "Validate the daily user schedule units"
run = "scripts/verify-user-schedule.bash"

[tasks."catalog:schedule:systemd:test:live"]
description = "Test a scheduled sync and concurrent manual sync in isolated storage"
run = "scripts/test-user-schedule-live.bash"

[tasks."catalog:schedule:systemd:install"]
description = "Install and enable the daily user schedule"
run = "scripts/install-user-schedule.bash"

[tasks."catalog:schedule:systemd:start:transient"]
description = "Start a daily user timer without persisting unit files"
run = "scripts/start-transient-user-schedule.bash"

[tasks."catalog:schedule:systemd:disable"]
description = "Stop transient scheduling and disable the installed daily timer"
run = "scripts/disable-user-schedule.bash"
